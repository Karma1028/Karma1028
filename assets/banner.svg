<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Tuhin Bhattacharya: data analyst and AI builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151a33"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
    .mono{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
    .name{font-size:58px;font-weight:800;fill:#f8fafc;letter-spacing:-1px}
    .role{font-size:26px;font-weight:600;fill:url(#line);opacity:0}
    .meta{font-size:15px;fill:#94a3b8;letter-spacing:0.5px}
    .tag{font-size:13px;fill:#2dd4bf}
    .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3.2s ease-out .4s forwards}
    .area{opacity:0;animation:fade 1.2s ease-out 2.6s forwards}
    .dot{opacity:0;animation:pop .5s ease-out forwards}
    .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .r1{animation:cycle 12s infinite}
    .r2{animation:cycle 12s infinite 4s}
    .r3{animation:cycle 12s infinite 8s}
    .orb{animation:float 9s ease-in-out infinite}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes fade{to{opacity:1}}
    @keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.9);opacity:0}}
    @keyframes cycle{0%{opacity:0;transform:translateY(10px)}6%,30%{opacity:1;transform:translateY(0)}36%,100%{opacity:0;transform:translateY(-10px)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}.area,.dot,.role{opacity:1}.r2,.r3{display:none}}
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <g class="orb"><circle cx="980" cy="70" r="190" fill="url(#glow)"/></g>
    <g class="orb" style="animation-delay:-4s"><circle cx="120" cy="300" r="150" fill="#a78bfa" fill-opacity="0.10"/></g>

    <!-- data -> insight -> decision chart -->
    <g transform="translate(640,0)">
      <path class="area" d="M0 250 L70 226 L140 238 L210 190 L280 200 L350 146 L420 160 L490 98 L560 48 L560 290 L0 290 Z" fill="url(#fill)"/>
      <path class="draw" d="M0 250 L70 226 L140 238 L210 190 L280 200 L350 146 L420 160 L490 98 L560 48" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#0b1020" stroke="#f8fafc" stroke-width="2.5">
        <circle class="dot" style="animation-delay:.8s"  cx="70"  cy="226" r="5"/>
        <circle class="dot" style="animation-delay:1.1s" cx="140" cy="238" r="5"/>
        <circle class="dot" style="animation-delay:1.4s" cx="210" cy="190" r="5"/>
        <circle class="dot" style="animation-delay:1.7s" cx="280" cy="200" r="5"/>
        <circle class="dot" style="animation-delay:2.0s" cx="350" cy="146" r="5"/>
        <circle class="dot" style="animation-delay:2.3s" cx="420" cy="160" r="5"/>
        <circle class="dot" style="animation-delay:2.6s" cx="490" cy="98"  r="5"/>
      </g>
      <circle class="dot" style="animation-delay:3.2s" cx="560" cy="48" r="9" fill="#fbbf24"/>
      <circle class="pulse" cx="560" cy="48" r="9" fill="#fbbf24"/>
      <g class="mono tag" opacity="0.9">
        <text x="0"   y="276">raw data</text>
        <text x="258" y="226">insight</text>
        <text x="500" y="30">decision</text>
      </g>
    </g>

    <!-- text -->
    <g class="sans">
      <text class="mono tag" x="64" y="78">&gt; hello, world<tspan class="cursor">_</tspan></text>
      <text class="name" x="62" y="148">Tuhin</text>
      <text class="name" x="62" y="208">Bhattacharya</text>
      <g transform="translate(64,252)">
        <text class="role r1" x="0" y="0">Data analyst</text>
        <text class="role r2" x="0" y="0">AI agent builder</text>
        <text class="role r3" x="0" y="0">Dashboards people actually use</text>
      </g>
      <text class="meta" x="64" y="293">Goa, India  ·  Python · SQL · React  ·  open to roles</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
