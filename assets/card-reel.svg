<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 232" width="440" height="232" role="img" aria-label="Reel Crew: A crew of AI agents that researches, scripts, voices and renders short videos."><style>.s{font-family:'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}.m{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes bounce{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(120px)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes blink{50%{opacity:0}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style><defs><linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#a3e635"/><stop offset="1" stop-color="#a3e635" stop-opacity=".15"/></linearGradient></defs><rect width="440" height="232" rx="16" fill="#10162b"/><rect width="440" height="4" rx="2" fill="url(#a)"/><rect x=".5" y=".5" width="439" height="231" rx="16" fill="none" stroke="#fff" stroke-opacity=".09"/><rect x="22" y="24" width="174" height="22" rx="11" fill="#a3e635" fill-opacity=".14"/><text class="m" x="33" y="39" font-size="10.5" letter-spacing="1" fill="#a3e635">PRIVATE · AI AGENTS</text><text class="s" x="22" y="78" font-size="19" font-weight="800" fill="#f8fafc">Reel Crew</text><text class="s" x="22" y="102" font-size="13" fill="#94a3b8">A crew of AI agents that researches,</text><text class="s" x="22" y="120" font-size="13" fill="#94a3b8">scripts, voices and renders short videos.</text><text class="m" x="22" y="200" font-size="12" font-weight="700" fill="#e2e8f0">24</text><text class="m" x="22" y="215" font-size="10" fill="#64748b">agents</text><text class="m" x="88.4" y="200" font-size="12" font-weight="700" fill="#e2e8f0">local</text><text class="m" x="88.4" y="215" font-size="10" fill="#64748b">TTS + ASR</text><text class="m" x="177.0" y="200" font-size="12" font-weight="700" fill="#e2e8f0">Remotion</text><text class="m" x="177.0" y="215" font-size="10" fill="#64748b">render</text><g transform="translate(286,46)"><rect x="0" y="8" width="128" height="22" rx="5" fill="#fff" fill-opacity=".05"/><rect x="0" y="11" width="34" height="16" rx="4" fill="#a3e635" fill-opacity="0.85"/><rect x="40" y="11" width="20" height="16" rx="4" fill="#a3e635" fill-opacity="0.85"/><rect x="66" y="11" width="44" height="16" rx="4" fill="#a3e635" fill-opacity="0.85"/><rect x="116" y="11" width="12" height="16" rx="4" fill="#a3e635" fill-opacity="0.85"/><rect x="0" y="38" width="128" height="22" rx="5" fill="#fff" fill-opacity=".05"/><rect x="6" y="41" width="52" height="16" rx="4" fill="#a3e635" fill-opacity="0.65"/><rect x="64" y="41" width="30" height="16" rx="4" fill="#a3e635" fill-opacity="0.65"/><rect x="100" y="41" width="28" height="16" rx="4" fill="#a3e635" fill-opacity="0.65"/><rect x="0" y="68" width="128" height="22" rx="5" fill="#fff" fill-opacity=".05"/><rect x="0" y="71" width="12" height="16" rx="4" fill="#a3e635" fill-opacity="0.45"/><rect x="20" y="71" width="12" height="16" rx="4" fill="#a3e635" fill-opacity="0.45"/><rect x="46" y="71" width="12" height="16" rx="4" fill="#a3e635" fill-opacity="0.45"/><rect x="72" y="71" width="12" height="16" rx="4" fill="#a3e635" fill-opacity="0.45"/><rect x="98" y="71" width="12" height="16" rx="4" fill="#a3e635" fill-opacity="0.45"/><g style="animation:sweep 3.4s linear infinite"><rect x="0" y="0" width="2" height="100" fill="#fbbf24"/></g><text class="m" x="0" y="124" font-size="10" fill="#64748b">script · voice · render</text></g></svg>